# render.yaml — deploy automático no Render
# IMPORTANTE: o web service precisa estar no plano "Starter" (~$7/mês) para não hibernar.
# Banco de dados: Supabase (externo) — ver DATABASE_URL abaixo. O Postgres
# gerenciado do Render ("pharos-db") não é mais usado; pode ser removido
# manualmente no dashboard do Render quando a migração for confirmada.

services:
  - type: web
    name: pharos-bot
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_DOMAIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REGISTRATION_PASSWORD
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
